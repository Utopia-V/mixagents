name: "文档或使用问题 / Documentation or question"
description: "提出使用问题，或指出说明不清、矛盾和缺失的信息。"
title: ""
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        直接写问题即可。相关页面、尝试和建议有助于回答，但不是提交前提。

        **不要提交 API key、token、完整请求头或未脱敏配置。**

  - type: textarea
    id: question
    attributes:
      label: "问题或文档缺口 / Question or documentation gap"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "Component（可选）"
      options:
        - "codex-deepseek-subagent"
        - "pi-dsh-mimic"
        - "Repository index or shared policy"
        - "Unsure"

  - type: input
    id: source
    attributes:
      label: "相关页面或文件 / Relevant page or file"
      description: "可选。填写仓库路径或 URL。"

  - type: textarea
    id: context
    attributes:
      label: "补充上下文 / Additional context"
      description: "可选。写下已经尝试的内容、相关 Issue 或建议修改。"

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: "敏感信息 / Sensitive data"
      options:
        - label: "我没有提交 API key、token、完整请求头、未脱敏配置或其他秘密。"
          required: true
