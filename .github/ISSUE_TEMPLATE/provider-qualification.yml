name: "Codex provider/model 适配与资格验证"
description: "提议或记录新的 Codex provider/model 组合及其已验证范围。"
title: ""
labels:
  - enhancement
  - provider
body:
  - type: markdown
    attributes:
      value: |
        这个表单用于支持范围声明，不是普通使用问题。尚未测试的提议也可以提交，请如实选择状态并把矩阵写成 not run。

        **不要提交 API key、token、完整请求头或未脱敏配置。**

  - type: dropdown
    id: qualification-status
    attributes:
      label: "当前状态 / Qualification status"
      options:
        - "仅提议，尚未实测 / Proposal, not tested"
        - "正在验证 / In qualification"
        - "部分通过 / Partially passing"
        - "完整通过所声明范围 / Passing the claimed scope"
        - "已确认不兼容 / Confirmed incompatible"
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: "Provider"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: "Model"
      description: "使用精确 model identifier。"
    validations:
      required: true

  - type: dropdown
    id: wire-api
    attributes:
      label: "Wire API"
      options:
        - "Responses"
        - "Chat Completions"
        - "Other or adapter"
        - "Unknown"
    validations:
      required: true

  - type: input
    id: authentication
    attributes:
      label: "认证类型 / Authentication type"
      description: "只写 env_key、command-backed auth 等机制，不要填写凭据值。"
    validations:
      required: true

  - type: textarea
    id: role
    attributes:
      label: "用途 / Intended role"
      description: "它适合承担什么工作，相对现有实现有什么实际差异？"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "测试环境 / Environment"
      placeholder: |
        Codex surface and version:
        Operating system:
        Parent model/provider:
        Child agent name:
        Multi-agent version:
    validations:
      required: true

  - type: textarea
    id: matrix
    attributes:
      label: "资格矩阵 / Qualification matrix"
      description: "每项写 pass、fail 或 not run；通过项附最短证据。"
      placeholder: |
        Direct model turn:
        Custom-agent discovery:
        Native V2 message delivery:
        Plaintext Hook delivery:
        Required local tool calls:
        Native callback:
        Cancellation behavior:
        Parent model/provider unchanged:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: "复现与证据 / Reproduction and evidence"
      description: "提供可重复步骤、随机 marker、脱敏结果和必要上游链接。提议阶段可以写 not run。"
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: "数据、安全与已知限制 / Boundaries"
      description: "说明发送给 provider 的数据、认证边界、费用和未支持能力。"
    validations:
      required: true

  - type: textarea
    id: adaptation
    attributes:
      label: "实现或适配说明 / Adaptation notes"
      description: "可选。列出已修改或计划修改的 Agent、provider config、Hook、Skill 与 smoke。"

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: "敏感信息 / Sensitive data"
      options:
        - label: "我没有提交 API key、token、完整请求头、未脱敏配置或其他秘密。"
          required: true
