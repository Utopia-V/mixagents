name: "Pi DSH Mimic 运行或安装故障"
description: "报告 pi-dsh-mimic 的安装、首请求、editor、恢复或 provider 故障。"
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请写下你实际看到的行为。不需要先判断失败发生在哪一层。

        **不要提交 API key、token、完整请求头、未脱敏 provider payload 或无关私有源码。**

  - type: dropdown
    id: route
    attributes:
      label: "Provider/model"
      options:
        - "deepseek/deepseek-v4-pro"
        - "opencode-go/deepseek-v4-pro"
        - "其他或不确定 / Other or unknown"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "环境 / Environment"
      description: "填写你知道的版本和 session 情况；不知道的项目可以删掉。"
      placeholder: |
        pi-dsh-mimic version or commit:
        Pi version:
        Node.js version:
        Operating system:
        Fresh session or existing conversation:
        Other loaded Pi packages:
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "发生了什么 / What happened"
      description: "说明实际结果，以及你原本期望发生什么。"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "怎样复现 / Reproduction"
      description: "列出能够复现问题的最少步骤；如果不能稳定复现，说明当时做了什么。"
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: "补充证据 / Additional evidence"
      description: "可选。填写 npm check、对照结果或最短脱敏日志。"
      render: shell

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: "敏感信息 / Sensitive data"
      options:
        - label: "我没有提交 API key、token、完整请求头、未脱敏 payload 或其他秘密。"
          required: true
