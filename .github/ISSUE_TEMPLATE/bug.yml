name: "问题报告 / Bug report"
description: "报告 MixAgents Broker 或 pi-dsh-mimic 的问题。 / Report a problem with MixAgents Broker or pi-dsh-mimic."
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "请不要粘贴 API key、token 或完整的请求头。 / Please don't paste API keys, tokens or full request headers."

  - type: dropdown
    id: component
    attributes:
      label: "组件 / Component"
      options:
        - "MixAgents Broker"
        - "pi-dsh-mimic"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "发生了什么 / What happened"
      description: "实际结果，以及你期望的结果。 / What you saw and what you expected."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "环境 / Environment"
      placeholder: |
        Package version:
        Codex or Pi version:
        OS and Node.js version:
        Provider and model (Broker: route name):

  - type: textarea
    id: reproduction
    attributes:
      label: "怎样复现 / How to reproduce"
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: logs
    attributes:
      label: "日志 / Logs"
      description: "可选。 / Optional."
      render: text
