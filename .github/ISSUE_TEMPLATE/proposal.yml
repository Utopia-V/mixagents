name: "改进提案 / Improvement proposal"
description: "说明一个真实问题，以及你希望看到的结果。"
title: ""
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        可以只提问题，也可以附带方案。新的 Codex provider/model 资格声明请使用专门表单。

  - type: dropdown
    id: component
    attributes:
      label: "Component"
      options:
        - "codex-deepseek-subagent"
        - "pi-dsh-mimic"
        - "Repository structure or shared documentation"
        - "Future component proposal"
        - "Unsure"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题 / Problem"
      description: "谁在什么情况下遇到了什么限制？有例子即可，不需要先完成根因分析。"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: "期望结果 / Desired outcome"
      description: "说明改进后用户或系统能够观察到什么变化。"
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: "想法与边界 / Ideas and boundaries"
      description: "可选。写下建议方案、可能影响的兼容性，或者仍不确定的地方。"

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: "敏感信息 / Sensitive data"
      options:
        - label: "我没有提交 API key、token、完整请求头、未脱敏配置或其他秘密。"
          required: true
